name: Ara.AI Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install linters
        run: pip install ruff black mypy

      - name: Auto-format codes (Black)
        run: black .

      - name: Auto-lint codes (Ruff)
        run: ruff check . --fix

      # ponytail: PR branches can't be pushed to (no-merge-commits ruleset rejects
      # the auto-format commit), so PRs only report; main still self-formats.
      - name: Check formatting (PRs)
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Commit and Push Changes
        if: github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "style: auto-format and lint [skip ci]"
          git push origin HEAD
