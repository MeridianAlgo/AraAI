[project]
name = "ara-ai"
version = "2.0.0"
description = "Ara.AI v8 - cross-sectional daily stock ranking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

# legacy/ is the frozen v7 stack, reached via PYTHONPATH, not installed.
# Without this, flat-layout auto-discovery sees ['ara', 'legacy'] and errors out.
[tool.setuptools.packages.find]
include = ["ara*"]

[tool.ruff]
line-length = 100
target-version = "py39"
# legacy/ is the frozen v7 stack. The lint workflow auto-formats and commits,
# and frozen code should not churn because a rule set moved.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*" = ["F401", "F811"]  # allow unused imports and redefinitions in tests

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | legacy
)/
'''

[tool.isort]
profile = "black"
line_length = 100
